{% extends "base.html" %}

{% block title %}Sign In — Personal Finance Advisor Bot{% endblock %}

{% block public_content %}
<div class="row justify-content-center py-4">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border rounded-4 p-4 bg-white">
      <div class="text-center mb-4">
        <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
          <i class="bi bi-lock-fill fs-3"></i>
        </div>
        <h4 class="fw-bold">Sign In</h4>
        <p class="text-muted small">Access your financial dashboard and AI advisor</p>
      </div>

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
            <label class="form-check-label small text-muted" for="rememberMe">
              Remember me
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted small">Don't have an account?</span>
        <a href="{{ url_for('auth.register') }}" class="small fw-semibold text-primary ms-1">Create an account</a>
      </div>

      <!-- Quick demo login helper -->
      <div class="mt-3 p-3 bg-light rounded text-center border">
        <div class="small text-muted mb-1">Quick Demo Access:</div>
        <a href="{{ url_for('auth.load_scenario', scenario='salaried') }}" class="btn btn-sm btn-outline-success w-100">
          <i class="bi bi-lightning-charge-fill me-1"></i> Load Salaried Demo Data
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
