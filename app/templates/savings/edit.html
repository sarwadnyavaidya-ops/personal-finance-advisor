{% extends "base.html" %}

{% block title %}Edit Savings — Personal Finance Advisor Bot{% endblock %}
{% block page_title %}Edit Savings Entry{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card-custom">
      <div class="card-header">
        <span class="fw-bold">Edit Savings Record</span>
        <a href="{{ url_for('savings.index') }}" class="btn btn-sm btn-outline-secondary">Back</a>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('savings.edit', savings_id=savings.id) }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Amount Saved</label>
            <div class="input-group">
              <span class="input-group-text">{{ current_user.currency_symbol }}</span>
              <input type="number" step="0.01" min="0.01" name="amount" class="form-control" value="{{ savings.amount }}" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Savings Vehicle / Destination</label>
            <select name="source" class="form-select" required>
              {% for src in sources %}
                <option value="{{ src }}" {% if savings.source == src %}selected{% endif %}>{{ src }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Date</label>
            <input type="date" name="date" class="form-control" value="{{ savings.date.strftime('%Y-%m-%d') }}" required>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold">Description / Purpose</label>
            <input type="text" name="description" class="form-control" value="{{ savings.description or '' }}">
          </div>

          <div class="d-flex justify-content-between">
            <a href="{{ url_for('savings.index') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary px-4">Update Record</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
