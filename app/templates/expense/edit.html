{% extends "base.html" %}

{% block title %}Edit Expense — Personal Finance Advisor Bot{% endblock %}
{% block page_title %}Edit Expense Entry{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card-custom">
      <div class="card-header">
        <span class="fw-bold">Edit Expense Record</span>
        <a href="{{ url_for('expense.index') }}" class="btn btn-sm btn-outline-secondary">Back</a>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('expense.edit', expense_id=expense.id) }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Amount</label>
            <div class="input-group">
              <span class="input-group-text">{{ current_user.currency_symbol }}</span>
              <input type="number" step="0.01" min="0.01" name="amount" class="form-control" value="{{ expense.amount }}" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Category</label>
            <select name="category_id" class="form-select" required>
              {% for cat in categories %}
                <option value="{{ cat.id }}" {% if expense.category_id == cat.id %}selected{% endif %}>{{ cat.name }} ({{ cat.type }})</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Payment Method</label>
            <select name="payment_method" class="form-select" required>
              {% for pm in payment_methods %}
                <option value="{{ pm }}" {% if expense.payment_method == pm %}selected{% endif %}>{{ pm }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Date</label>
            <input type="date" name="date" class="form-control" value="{{ expense.date.strftime('%Y-%m-%d') }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Description</label>
            <input type="text" name="description" class="form-control" value="{{ expense.description or '' }}">
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="is_recurring" id="isRecurringEdit" {% if expense.is_recurring %}checked{% endif %}>
            <label class="form-check-label small" for="isRecurringEdit">
              Recurring monthly expense
            </label>
          </div>

          <div class="d-flex justify-content-between">
            <a href="{{ url_for('expense.index') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger px-4">Update Expense</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
